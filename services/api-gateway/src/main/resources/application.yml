server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    # Reduce service-instance cache TTL so the gateway picks up newly registered
    # instances faster (default is 35 s, which causes 503s during cold starts).
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webflux:
          # A ROUTE is the basic building block of the gateway. It answers 3 questions:
          #   1. WHERE to send the request  -> id + uri
          #   2. WHEN does this route apply -> predicates
          #   3. WHAT to change on the way  -> filters
          routes:
            - id: customer-service            # unique name of the route
              # lb:// = ask Eureka for an instance of customer-service (step-03-discovery).
              # The customer-service.url property can still override it (useful for tests).
              uri: ${customer-service.url:lb://customer-service}
              # PREDICATES = conditions deciding whether a request matches this route.
              predicates:
                - Path=/api/customers/**
              # FILTERS = actions applied to the request and/or the response.
              filters:
                - AddResponseHeader=X-Served-By, api-gateway
                # Retry on 503 (no instance available yet) — safe for GET-only route.
                - name: Retry
                  args:
                    retries: 3
                    statuses: SERVICE_UNAVAILABLE
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 500ms
                      factor: 2

            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/v1/events/**
              filters:
                # Retry on 503 — safe for GET-only route.
                - name: Retry
                  args:
                    retries: 3
                    statuses: SERVICE_UNAVAILABLE
                    methods: GET
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 500ms
                      factor: 2

            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**
              filters:
                # Retry on 503 only — a 503 at gateway level means the backend was
                # unreachable (request never reached booking-service), so POST is safe
                # to retry here. Business errors (409, 422) are not retried.
                - name: Retry
                  args:
                    retries: 3
                    statuses: SERVICE_UNAVAILABLE
                    methods: GET,POST
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 500ms
                      factor: 2

management:
  endpoints:
    web:
      exposure:
        # "gateway" exposes /actuator/gateway/routes to list the routes the gateway knows
        include: health,info,gateway

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

