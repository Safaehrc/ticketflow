spring.application.name=booking-service
server.port=8083

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop

management.endpoints.web.exposure.include=health,info

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Feign timeouts (TP4)
spring.cloud.openfeign.client.config.event-service.connect-timeout=2000
spring.cloud.openfeign.client.config.event-service.read-timeout=3000

# Circuit breaker (TP5): one circuit for the whole event-service Feign client
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true

# Empty = resolve by name through Eureka. Set it (e.g. http://localhost:8082) to bypass Eureka.
ticketflow.clients.event-service.url=${EVENT_SERVICE_URL:}

ticketflow.resilience.event-service.sliding-window-size=10
ticketflow.resilience.event-service.minimum-number-of-calls=5
ticketflow.resilience.event-service.failure-rate-threshold=50
ticketflow.resilience.event-service.wait-in-open-state=10s
ticketflow.resilience.event-service.permitted-calls-in-half-open-state=3
ticketflow.resilience.event-service.time-limit=4s