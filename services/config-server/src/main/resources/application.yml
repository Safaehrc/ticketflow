server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/Safaehrc/ticketflow.git}
          default-label: ${CONFIG_GIT_LABEL:config}
          # Clone au demarrage : une mauvaise URL echoue tout de suite, dans les logs
          clone-on-start: true
          force-pull: true
          refresh-rate: ${CONFIG_GIT_REFRESH_RATE:30}
          timeout: 10
        # Utilise seulement avec le profil "native" (tests, ou lancement sans depot Git)
        native:
          search-locations: ${CONFIG_REPO:classpath:/config-repo/}

management:
  endpoints:
    web:
      exposure:
        include: health,info